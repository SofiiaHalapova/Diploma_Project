{% extends "base.html" %} {% block title %}Home{% endblock %} {% block content %}
    <form method="POST">
        <br/>
        <h3 class="text-center">Log In</h3>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    placeholder="Enter email"
            />
        </div>
        <div class="form-group" style="position: relative;">
            <label for="password">Password</label>
            <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    placeholder="Enter password"
            >
            <i class="bi bi-eye-slash toggle-password" data-target="password"
               style="position: absolute; right: 10px; top: 38px; cursor: pointer;"></i>
        </div>
        <br/>
        <button type="submit" class="btn btn-primary">Login</button>
    </form>

{#        <button type="submit" class="btn btn-primary">Try out without login</button>#}
{#    </form>#}
    <script>
        document.querySelectorAll('.toggle-password').forEach(icon => {
            icon.addEventListener('click', function () {
                const passwordField = document.getElementById(this.getAttribute('data-target'));
                passwordField.type = passwordField.type === 'password' ? 'text' : 'password';

                this.classList.toggle('bi-eye');
                this.classList.toggle('bi-eye-slash');
            });
        });
    </script>
{% endblock %}
