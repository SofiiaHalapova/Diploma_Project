{% extends "base.html" %} {% block title %}Project{% endblock %} {% block content %}

        <h1>Classes Prediction {{ classification_method }}</h1>

             alt="Classes Prediction">
        <br>
        <div class="d-flex justify-content-between">
            <a class="btn btn-light" href="{{ url_for('views.project_details', project_id=project.id) }}">

               href="{{ url_for('views.download',filename=image_path.replace('/static/', '')) }}">

            </a>
        </div>
    </form>
{% endblock %}
