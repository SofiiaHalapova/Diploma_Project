{% extends "base.html" %} {% block title %}Home{% endblock %} {% block content
%}



<form method = "POST">
    <br />
  <h3 align="center">Sign Up</h3>
  <div class="form-group">
    <label for="email">Email Address</label>
    <input
      type="email"
      class="form-control"
      id="email"
      name="email"
      placeholder="Enter email"
    />
  </div>
  <div class="form-group">
    <label for="firstName">First Name</label>
    <input
      type="text"
      class="form-control"
      id="firstName"
      name="firstName"
      placeholder="Enter first name"
    />
  </div>
  <div class="form-group" style="position: relative;">
    <label for="password1">Password</label>
    <input
      type="password"
      class="form-control"
      id="password1"
      name="password1"
      placeholder="Enter password"
    >
    <i class="bi bi-eye-slash toggle-password" data-target="password1"
       style="position: absolute; right: 10px; top: 38px; cursor: pointer;"></i>
  </div>
  <div class="form-group" style="position: relative;">
    <label for="password2">Password (Confirm)</label>
    <input
      type="password"
      class="form-control"
      id="password2"
      name="password2"
      placeholder="Confirm password"
    >
    <i class="bi bi-eye-slash toggle-password" data-target="password2"
       style="position: absolute; right: 10px; top: 38px; cursor: pointer;"></i>
  </div>
  <br/>
  <button type="submit" class="btn btn-primary">Submit</button>
</form>


<script>
  document.querySelectorAll('.toggle-password').forEach(icon => {
      icon.addEventListener('click', function () {
          const passwordField = document.getElementById(this.getAttribute('data-target'));
          const type = passwordField.type === 'password' ? 'text' : 'password';
          passwordField.type = type;

          this.classList.toggle('bi-eye');
          this.classList.toggle('bi-eye-slash');
      });
  });
</script>
{% endblock %}
