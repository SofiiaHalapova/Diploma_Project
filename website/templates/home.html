{% extends "base.html" %} {% block title %}Home{% endblock %} {% block content %}
    <form action="{{ url_for("views.new_project") }}" method="POST" enctype="multipart/form-data">
        <br>
        <button type="button" class="btn btn-primary" data-toggle="modal" data-target="#dataUploadModal"
                data-whatever="@mdo">New Project
        </button>

        <div class="modal fade" id="dataUploadModal" tabindex="-1" role="dialog" aria-labelledby="dataUploadModalLabel"
             aria-hidden="true">
            <div class="modal-dialog" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="dataUploadModalLabel">Start with Your New Project!</h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">

                        <div class="form-group">
                            <label for="project_name" class="col-form-label">Project Name</label>
                            <input type="text" class="form-control" id="project_name" name="project_name">
                        </div>

                        <!-- Upload Method Selection -->
                        <div class="form-group">
                            <label>Choose upload method</label><br>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="upload_method"
                                       id="upload-archive-radio" value="archive" checked>
                                <label class="form-check-label" for="upload-archive-radio">Upload Archive</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="upload_method"
                                       id="upload-link-radio" value="link">
                                <label class="form-check-label" for="upload-link-radio">Paste Link</label>
                            </div>
                        </div>


                        <!-- Archive Upload Input -->
                        <div class="form-group" id="upload-archive-group">
                            <label for="dataset-archive">Upload dataset archive</label>
                            <input type="file" class="form-control-file" id="dataset_archive" name="dataset_archive"
                                   accept=".zip,.tar,.gz">
                        </div>

                        <!-- Link Input -->
                        <div class="form-group d-none" id="upload-link-group">
                            <label for="dataset-link">Paste link to dataset</label>
                            <input type="url" class="form-control" id="dataset_link" name="dataset_link"
                                   placeholder="https://example.com/dataset.zip">
                        </div>
                        <div class="form-group">
                            <label for="classifaction_classes" class="col-form-label">Please List Classification
                                Classes</label>
                            <textarea class="form-control" id="classifaction_classes"
                                      placeholder="e.g. cat, dog, bird"></textarea>
                        </div>
                        <select class="form-select" aria-label="Default select example" name="classification_method"
                                id="classification_method">
                            <option selected>Open this select menu</option>
                            <option value="xg-boost">XG Boost</option>
                            <option value="k-means">K-Means</option>
                            <option value="k-nearest">K-Nearest</option>
                            <option value="random-forest-classifier">Random Forest Classifier</option>
                            <option value="logistic-regression">Logistic Regression</option>
                            <option value="naive-bayes">Naive Bayes??????????????????????</option>
                        </select>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary">Create Project</button>
                    </div>
                </div>
            </div>
        </div>
    </form>

    <script>
        const archiveRadio = document.getElementById('upload-archive-radio');
        const linkRadio = document.getElementById('upload-link-radio');
        const archiveGroup = document.getElementById('upload-archive-group');
        const linkGroup = document.getElementById('upload-link-group');

        archiveRadio.addEventListener('change', () => {
            if (archiveRadio.checked) {
                archiveGroup.classList.remove('d-none');
                linkGroup.classList.add('d-none');
            }
        });

        linkRadio.addEventListener('change', () => {
            if (linkRadio.checked) {
                archiveGroup.classList.add('d-none');
                linkGroup.classList.remove('d-none');
            }
        });
    </script>
{% endblock %}
